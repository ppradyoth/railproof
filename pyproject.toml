[project]
name = "railproof"
version = "0.1.0"
description = "Verifiable security contracts for AI agent actions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Pradyoth Prashanth" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.23,<5",
    "pyyaml>=6.0,<7",
]

[project.scripts]
railproof = "railproof.cli:main"

[project.urls]
Repository = "https://github.com/ppradyoth/railproof"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN401", "COM812", "CPY001", "D", "EM101", "EM102", "ISC001", "N818", "TRY003", "TRY301"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**/*.py" = ["INP001", "SLF001", "T201"]
"examples/**/*.py" = ["INP001", "T201"]
"src/railproof/cli.py" = ["T201"]
"src/railproof/canonical.py" = ["C901"]
"src/railproof/engine.py" = ["C901", "PLR0911"]
"src/railproof/executor.py" = ["PLR0913"]
"src/railproof/policy.py" = ["C901", "PLR0911"]
"tests/**/*.py" = ["ANN", "ARG", "INP001", "PLR2004", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=railproof",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/railproof"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

[dependency-groups]
audit = [
    "pip-audit>=2.10.1",
]
benchmark = [
    "nemoguardrails==0.24.0",
]
dev = [
    "ruff>=0.16.7",
    "ty>=0.0.80",
]
test = [
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
